<!doctype html><html><head><style>
@font-face { font-family: Outfit; src: url(../../public/fonts/Outfit-Variable.woff2) format('woff2'); font-weight: 100 900; }
html,body{margin:0}
.og{width:1200px;height:630px;position:relative;overflow:hidden;font-family:Outfit,sans-serif;color:#E5E7EB;
 background:
  linear-gradient(115deg, transparent 0 79%, #A3E635 79% 81.5%, transparent 81.5% 84.5%, rgba(163,230,53,.35) 84.5% 85.3%, transparent 85.3%),
  radial-gradient(circle at 85% 30%, #1b2740 0, #0B1220 60%);}
.text{position:absolute;left:64px;top:60px;width:560px}
.text img{height:40px;display:block;margin-bottom:44px}
h1{margin:0;font-size:76px;line-height:1.0;font-weight:700;letter-spacing:-.01em;color:#fff}
h1 em{font-style:normal;color:#A3E635}
p{margin:26px 0 0;font-size:27px;line-height:1.35;font-weight:500;color:#CBD5E1;max-width:500px}
p b{color:#fff;font-weight:700}
.cta{position:absolute;left:64px;bottom:52px;display:flex;align-items:center;gap:18px}
.cta b{background:#A3E635;color:#0B1220;font-size:28px;font-weight:700;border-radius:14px;padding:14px 30px}
.cta span{font-size:22px;font-weight:600;color:#94A3B8}
/* courts, up next and who's on the way */
.stack{position:absolute;left:660px;top:92px;width:410px;display:grid;gap:12px}
.court{background:#111A2E;border:1px solid #2A3550;border-radius:18px;padding:14px 18px;box-shadow:0 18px 44px rgba(0,0,0,.45)}
.court.live{border-left:5px solid #F87171}
.court .no{font-size:14px;font-weight:700;letter-spacing:.08em;color:#94A3B8;display:flex;justify-content:space-between}
.court .no em{font-style:normal;color:#F87171}
.row{display:flex;justify-content:space-between;font-size:21px;font-weight:600;margin-top:6px}
.row b{font-size:26px;color:#fff}
.next{background:#111A2E;border:1px solid #2A3550;border-radius:18px;padding:14px 18px}
.next .lab{font-size:14px;font-weight:700;letter-spacing:.08em;color:#94A3B8}
.next .teams{font-size:21px;font-weight:600;margin-top:6px}
.next .teams span{color:#A3E635;margin:0 8px}
.way{display:flex;flex-wrap:wrap;gap:7px;align-items:center;font-size:16px;color:#94A3B8}
.way span{background:#18233A;border:1px solid #2A3550;border-radius:999px;padding:4px 11px;color:#E5E7EB;font-weight:500}
.way small{color:#94A3B8}
</style></head><body><div class="og">
<div class="text">
<img src="../../public/brand/logo-white.svg">
<h1>Game on.<br><em>Are you in?</em></h1>
<p>Tap <b>I'm in</b>, say when you're coming, and get picked for fair games when you arrive.</p>
</div>
<div class="cta"><b>I'm in →</b><span>tonament.com</span></div>
<div class="stack">
<div class="court live"><div class="no">COURT 1 <em>● LIVE</em></div><div class="row">Asha &amp; Ravi<b>18</b></div><div class="row">Kiran &amp; Meera<b>15</b></div></div>
<div class="court live"><div class="no">COURT 2 <em>● LIVE</em></div><div class="row">Dev &amp; Priya<b>9</b></div><div class="row">Sam &amp; Joy<b>11</b></div></div>
<div class="next"><div class="lab">UP NEXT</div><div class="teams">Anu &amp; Bala<span>v</span>Chitra &amp; Farid</div></div>
<div class="way">On the way: <span>Nikhil <small>7:30</small></span><span>Tara <small>8:00</small></span></div>
</div>
</div></body></html>
