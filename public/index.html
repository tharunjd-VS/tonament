<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tonament — One platform. Every sport. Every tournament.</title>
  <meta name="description" content="Run league and knockout tournaments and score every match live. One platform. Every sport. Every tournament.">
  <meta name="theme-color" content="#0B1220">
  <script>
    // Apply the saved theme before first paint (Auto follows the device; default is dark).
    (function () {
      var pref = 'auto';
      try { pref = localStorage.getItem('tonament:theme') || 'auto'; } catch (e) {}
      var light = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
      document.documentElement.setAttribute('data-theme', pref === 'auto' ? (light ? 'light' : 'dark') : pref);
      document.documentElement.setAttribute('data-theme-pref', pref);
    })();
  </script>
  <link rel="preload" href="/fonts/Outfit-Variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/styles.css">
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" href="/brand/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Tonament">
  <meta property="og:title" content="Tonament — One platform. Every sport. Every tournament.">
  <meta property="og:description" content="Run league and knockout tournaments and score every match live.">
  <meta property="og:url" content="https://tonament.com/">
  <meta property="og:image" content="https://tonament.com/brand/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://tonament.com/brand/og.png">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a href="#/" class="brand" aria-label="Tonament home">
        <img src="/brand/logo-white.svg" alt="Tonament" width="190" height="26">
      </a>
      <nav id="nav" class="nav" aria-label="Account"></nav>
    </div>
  </header>
  <main id="app" class="container" aria-live="polite"></main>
  <footer class="footer">
    <div class="footer-inner">
      <div class="footer-brand">
        <img src="/brand/mark-white.svg" class="on-dark" alt="" width="31" height="22">
        <img src="/brand/mark.svg" class="on-light" alt="" width="31" height="22">
        <span class="eyebrow">One platform. Every sport. <b>Every tournament.</b></span>
      </div>
      <nav class="footer-links" aria-label="Policies">
        <a href="/pricing">Pricing</a><a href="/contact">Contact</a><a href="/terms">Terms</a><a href="/privacy">Privacy</a><a href="/refunds">Refunds</a><a href="/delivery">Delivery</a>
      </nav>
      <div id="theme-switch-footer"></div>
    </div>
    <p class="footer-legal">Payments are processed securely by Razorpay.</p>
  </footer>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="/sports/badminton.js"></script>
  <script src="/regions.js"></script>
  <script src="/app.js"></script>
</body>
</html>
